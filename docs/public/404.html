<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面跳转中 | NR通信面试宝典</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #f6f6f7; color: #3c3c43; display: flex; align-items: center;
         justify-content: center; min-height: 100vh; margin: 0; }
  .box { text-align: center; padding: 40px 24px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { color: #6b6b76; font-size: 14px; margin: 8px 0; }
  a { color: #3e63dd; text-decoration: none; }
  a.btn { display: inline-block; margin: 14px 8px 0; padding: 8px 18px; border-radius: 8px;
          background: #3e63dd; color: #fff; font-size: 14px; }
  .spin { display: inline-block; width: 22px; height: 22px; border: 3px solid #c3d2ff;
          border-top-color: #3e63dd; border-radius: 50%; animation: r 0.8s linear infinite;
          margin-bottom: 16px; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <h1>地址不完整，正在自动跳转…</h1>
  <p id="msg">正在尝试补全页面地址（例如 /dashboard → /dashboard.html）</p>
  <div id="fallback" style="display:none">
    <p>未能自动定位页面，你可以：</p>
    <a class="btn" id="try-candidate" href="/">重试一次</a>
    <a class="btn" id="home" href="/nr-interview-bible/">回首页</a>
    <a class="btn" href="/nr-interview-bible/bank.html">题库</a>
    <p style="margin-top:18px">或从 <a href="/nr-interview-bible/paths/index.html">专题学习</a> / <a href="/nr-interview-bible/notes.html">笔记中心</a> 进入</p>
  </div>
</div>
<script>
(function () {
  var path = location.pathname.replace(/\/+$/, '');
  var base = '/nr-interview-bible';
  var candidates = [];
  if (path === base || path === '') {
    candidates.push(base + '/index.html');
  } else if (path.indexOf('.') === -1) {
    candidates.push(path + '.html');
    candidates.push(path + '/index.html');
  } else {
    candidates.push(path);
  }
  var i = 0;
  function tryNext() {
    if (i >= candidates.length) {
      document.getElementById('msg').textContent = '该页面不存在（可能已改名或尚未生成）';
      document.getElementById('try-candidate').href = candidates[0];
      document.getElementById('fallback').style.display = 'block';
      document.querySelector('.spin').style.display = 'none';
      return;
    }
    var url = candidates[i++] + location.search + location.hash;
    fetch(url, { method: 'HEAD' }).then(function (r) {
      if (r.ok) { location.replace(url); }
      else { setTimeout(tryNext, 120); }
    }).catch(function () { setTimeout(tryNext, 120); });
  }
  setTimeout(tryNext, 50);
})();
</script>
</body>
</html>
